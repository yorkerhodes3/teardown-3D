name: Publish Lenovo demo

on:
  push:
    branches: [main]
    paths:
      - 'sims/lenovo-*/**'
      - 'sims/kit/**'
      - 'sims/build.mjs'
      - 'paths.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test sims/lenovo-shared/bom-format.test.mjs
      - run: node sims/build.mjs lenovo-live
      - name: Prepare site
        run: |
          mkdir -p _site
          cp teardown-out/dist/lenovo-live.html _site/index.html
          cp teardown-out/dist/lenovo-live.html _site/lenovo-live.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
